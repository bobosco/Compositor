name: Build App

# Run by hand from the Actions tab. Builds a Release Compositor.app and keeps it as an artifact.
# Ad-hoc signed, no Developer ID: fine on your own Mac, where you clear quarantine after download:
#   xattr -dr com.apple.quarantine Compositor.app
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          MACOSX_DEPLOYMENT_TARGET=15.0

      - name: Zip the app
        run: ditto -c -k --keepParent DerivedData/Build/Products/Release/Compositor.app Compositor.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-macos-arm64
          path: Compositor.zip
          retention-days: 30
